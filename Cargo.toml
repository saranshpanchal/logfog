[package]
name = "logfog"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cut through the log fog. One index, two faces: an agent-first CLI/MCP and a loopback browser log explorer."
license = "MIT"
readme = "README.md"
keywords = ["logs", "observability", "mcp", "tui"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "logfog"
path = "src/lib.rs"

[[bin]]
name = "logfog"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1"
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
flate2 = "1"
futures = "0.3"
humantime = "2"
memchr = "2"
memmap2 = "0.9"
notify = "6"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
walkdir = "2"
zstd = "0.13"
ratatui = "0.28"

[dev-dependencies]
flate2 = "1"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
zstd = "0.13"
