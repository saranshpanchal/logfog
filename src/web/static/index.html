<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LogFog</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 22 L16 6 L28 22" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M9 22h14" stroke="currentColor" stroke-width="2.4"/></svg>
      <div>
        <strong>LogFog</strong>
        <em>cut through the log fog</em>
      </div>
    </div>
    <form id="qform">
      <input id="q" spellcheck="false" autocomplete="off"
        placeholder='level:error service:api status:>=500 -service:healthcheck "timeout"' />
    </form>
    <div class="top-actions">
      <button type="button" id="tab-logs" class="tab on">Logs</button>
      <button type="button" id="tab-patterns" class="tab">Patterns</button>
      <button type="button" id="live" class="live">Live</button>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="workspace">
    <aside id="facets"></aside>
    <main>
      <section id="logs-view">
        <div class="hist-wrap">
          <canvas id="hist" height="96"></canvas>
          <button type="button" id="clear-brush" hidden>Clear time brush</button>
        </div>
        <div class="table-head">
          <span>time</span><span>level</span><span>service</span><span>message</span>
        </div>
        <div id="scroller">
          <div id="spacer"></div>
          <div id="rows"></div>
        </div>
      </section>
      <section id="patterns-view" hidden></section>
    </main>
  </div>
  <div id="drawer" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
